name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: 'Install libpq'
      run: sudo apt-get install -y libpq-dev lighttpd
    - name: 'Build chatlog'
      run: make
    - name: 'Check configs, channel list and page links'
      run: make check
    - name: 'Check lighttpd config syntax'
      run: |
        sudo mkdir -p /etc/ssl/uacme/uogradnet.xyz /etc/ssl/uacme/private/uogradnet.xyz
        sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
          -subj /CN=uogradnet.xyz \
          -keyout /etc/ssl/uacme/private/uogradnet.xyz/key.pem \
          -out /etc/ssl/uacme/uogradnet.xyz/cert.pem
        lighttpd -tt -f lighttpd/lighttpd.conf
