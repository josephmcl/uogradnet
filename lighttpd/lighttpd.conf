# lighttpd configuration for UOGradNet (installed as /etc/lighttpd/lighttpd.conf).
#
#   uogradnet.xyz        landing page            /srv/uogradnet/www/site      (repo: www/)
#   cs.uogradnet.xyz     CS page                 /srv/uogradnet/www/site/cs   (repo: www/cs/)
#                        + /static/ -> the landing page's static/ folder
#   chat.uogradnet.xyz   Kiwi IRC webchat        /srv/uogradnet/www/chat
#                        + /webirc  -> UnrealIRCd WebSocket on 127.0.0.1:8000
#   irc.uogradnet.xyz    browsers get sent to the "Join" section of the landing page
#
# One Let's Encrypt certificate (from uacme) covers all four names.

server.modules = (
	"mod_access",
	"mod_expire",
	"mod_alias",
	"mod_redirect",
	"mod_setenv",
	"mod_openssl",
	"mod_proxy",
	"mod_accesslog",
)

server.username      = "www-data"
server.groupname     = "www-data"
server.pid-file      = "/run/lighttpd.pid"
server.errorlog      = "/var/log/lighttpd/error.log"
accesslog.filename   = "/var/log/lighttpd/access.log"
server.port          = 80
server.document-root = "/srv/uogradnet/www/site"
server.tag           = "lighttpd"
index-file.names     = ( "index.html" )
url.access-deny      = ( "~", ".inc" )
include_shell "/usr/share/lighttpd/create-mime.conf.pl"

$SERVER["socket"] == ":443" {
	ssl.engine  = "enable"
	ssl.pemfile = "/etc/ssl/uacme/uogradnet.xyz/cert.pem"
	ssl.privkey = "/etc/ssl/uacme/private/uogradnet.xyz/key.pem"
	setenv.add-response-header = (
		"Strict-Transport-Security" => "max-age=31536000",
		"X-Content-Type-Options"    => "nosniff",
		"Referrer-Policy"           => "same-origin",
	)
	$HTTP["url"] =~ "^/static/" {
		expire.url = ( "" => "access plus 7 days" )
	}
}

# Port 80 only answers Let's Encrypt challenges (written by uacme's hook);
# everything else is redirected to HTTPS.
$HTTP["scheme"] == "http" {
	$HTTP["url"] =~ "^/\.well-known/acme-challenge/" {
		alias.url = ( "/.well-known/acme-challenge/" => "/var/www/.well-known/acme-challenge/" )
	}
	else {
		url.redirect      = ( "" => "https://${url.authority}${url.path}${qsa}" )
		url.redirect-code = 301
	}
}

$HTTP["scheme"] == "https" {
	$HTTP["host"] == "cs.uogradnet.xyz" {
		server.document-root = "/srv/uogradnet/www/site/cs"
		alias.url = ( "/static/" => "/srv/uogradnet/www/site/static/" )
	}
	$HTTP["host"] == "chat.uogradnet.xyz" {
		server.document-root = "/srv/uogradnet/www/chat"
		$HTTP["url"] =~ "^/webirc" {
			proxy.server    = ( "" => ( ( "host" => "127.0.0.1", "port" => 8000 ) ) )
			proxy.header    = ( "upgrade" => "enable" )
			proxy.forwarded = ( "for" => 1, "proto" => 1 )
		}
	}
	$HTTP["host"] == "irc.uogradnet.xyz" {
		url.redirect = ( "" => "https://uogradnet.xyz/#join" )
	}
}
